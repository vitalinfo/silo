# Copy to run.yaml and edit for each report run. run.yaml is gitignored.

periods:
  - label: Q1
    from: 2026-01-01
    to: 2026-03-31
  - label: Q2_so_far
    from: 2026-04-01
    to: 2026-05-13

# "all" or a list of team names from teams.yaml
teams: all

comparisons:
  period_over_period: true   # compare each team across the periods listed above
  cross_team: true           # compare teams within the latest period

reports:
  - team_lead
  - exec

# Wall-clock workday shape, shared across the team. Each member's timezone
# (in teams.yaml) determines when these hours fall in real (UTC) time.
work_hours:
  start: "09:00"
  end: "18:00"
  workdays: [mon, tue, wed, thu, fri]
