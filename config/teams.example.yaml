# Copy to teams.yaml and fill in your real values. teams.yaml is gitignored.

github_orgs:
  - example-org-a
  - example-org-b

teams:
  - name: backend
    lead: alice@example.com
    members:
      - github: alice-gh
        google: alice@example.com
        tz: "America/New_York"     # IANA name; defaults to UTC if omitted
      - github: bob-gh
        google: bob@example.com
        tz: "Europe/London"

  - name: frontend
    lead: carol@example.com
    members:
      - github: carol-gh
        google: carol@example.com
        tz: "America/Los_Angeles"

      # Bots / service accounts: omit `google` (and `tz`). Their PRs are still
      # collected so throughput counts are accurate, but calendar-derived
      # metrics are skipped for them.
      - github: dependabot[bot]
